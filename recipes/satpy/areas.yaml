# Custom area definitions.
#
# See https://satpy.readthedocs.io/en/stable/resample.html#create-custom-area-definition
italy:
  description: italy
  projection:
    proj: merc
    lon_0: 12
    k: 1
    x_0: 0
    y_0: 0
    datum: WGS84
    no_defs: null
    type: crs
  shape:
   # height: 3737
   height: 934
   # width: 3571
   width: 892
  area_extent:
    lower_left_xy: [-901500.0, 4159500.0]
    upper_right_xy: [884000.0, 6028000.0]
    units: m
