italy_fci_mtg:
  description: "Italia per MTG-I FCI"
  projection:
    proj: geos
    h: 35786400
    lon_0: 0
    sweep: x
    ellps: WGS84
  shape:
    height: 2000
    width: 1800
  area_extent:
    # xmin, ymin, xmax, ymax  (in metri GEOS)
    [180000, 3100000, 1700000, 5000000]
